# Font configuration
font_family FiraCode Nerd Font Mono
bold_font auto
italic_font Maple Mono
bold_italic_font auto

symbol_map U+E000-U+F8FF Symbols Nerd Font Mono
font_size 15.25
adjust_line_height 0
adjust_column_width 0
adjust_baseline 0
adjust_underline_position 4

# Cursor configuration with trail effects
cursor_shape block
cursor_beam_thickness 1.5
cursor_underline_thickness 2.0
cursor_blink_interval -1
cursor_stop_blinking_after 15.0

# Enhanced cursor trail effects
cursor_trail 1
cursor_trail_decay 0.1 0.4

# Window settings
hide_window_decorations yes
remember_window_size yes
initial_window_width 1200
initial_window_height 800
window_padding_width 2
window_padding_height 2

# Performance optimizations for smooth cursor effects
repaint_delay 10
input_delay 3
sync_to_monitor yes

# Basic theme (optional)
background_opacity 0.8
dynamic_background_opacity yes

# Color scheme (simple dark theme)
# foreground #ffffff
# background #1a1a1a
# cursor #ffffff
# cursor_text_color #000000

# Terminal bell
enable_audio_bell no
visual_bell_duration 0.0

# Tab bar
tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style slanted

# Other useful settings
scrollback_lines 10000
wheel_scroll_multiplier 5.0
touch_scroll_multiplier 1.0
mouse_hide_wait 3.0
# url_color #0087bd
url_style curly
open_url_with default
copy_on_select no
strip_trailing_spaces never



# BEGIN_KITTY_THEME
# Solarized Dark Higher Contrast
include current-theme.conf
# END_KITTY_THEME
