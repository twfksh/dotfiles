setw -g mouse on

set-option -ga terminal-overrides ",xterm-256color:Tc"

# Match window numbers to the order of the keys on a keyboard.
set -g base-index 1
setw -g pane-base-index 1

setw -g renumber-windows on

# Keys
unbind-key C-b
set -g prefix C-Space
bind-key C-Space send-prefix

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Initialize tmux plugin manager
run '~/.tmux/plugins/tpm/tpm'

# ========================================
# GREY THEME SECTION
# ========================================

# Full Grey Theme (Default)
# Pane borders
set -g pane-border-style "fg=#4a5568,bg=default"
set -g pane-active-border-style "fg=#718096,bg=default"

# Status bar
set -g status-bg "#2d3748"
set -g status-fg "#e2e8f0"
set -g status-left-length 50
set -g status-right-length 100
set -g status-justify left

# Status content
set -g status-left "#[fg=#1a202c,bg=#a0aec0,bold] #{session_name} "
set -g status-right "#[fg=#718096,bg=#2d3748] #(uptime | cut -d',' -f3- | sed 's/load average://') #[fg=#4a5568,bg=#2d3748]│#[fg=#a0aec0] %H:%M #[fg=#4a5568]│#[fg=#cbd5e0] %d %b #[fg=#a0aec0,bg=#4a5568]#[fg=#e2e8f0,bg=#4a5568] #h "

# Window status
set -g window-status-style "fg=#718096,bg=#2d3748"
set -g window-status-format " #[fg=#9ca3af]#I#[fg=#6b7280]:#[fg=#9ca3af]#W#F "
set -g window-status-current-style "fg=#1a202c,bg=#a0aec0,bold"
set -g window-status-current-format " #[fg=#1a202c]#I#[fg=#374151]:#[fg=#1a202c]#W#F "
set -g window-status-separator ""

# Messages and modes
set -g message-style "fg=#f7fafc,bg=#4a5568,bold"
set -g message-command-style "fg=#f7fafc,bg=#4a5568,bold"
set -g mode-style "fg=#1a202c,bg=#a0aec0"

